<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOMINAO</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./app.ts"></script>
  </head>
  <body>
    <h1>DOMINAO</h1>
    <form id="start" hidden>
      <input name="displayName" placeholder="Your name" maxlength="20" required />
      <button>Play as guest</button>
    </form>
    <section id="welcome" hidden>
      <p><span id="greeting"></span> <button id="leave">Leave</button></p>
      <section id="home">
        <button id="open">Create private table</button>
        <form id="join">
          <input name="code" placeholder="Join code" maxlength="6" required />
          <button>Join table</button>
        </form>
      </section>
      <section id="lobby" hidden>
        <h2>Table <span id="code"></span></h2>
        <p>Share this code with your friends. Seats 0 and 2 are partners, as are 1 and 3.</p>
        <ol id="seats" start="0"></ol>
        <button id="startGame" hidden>Start game</button>
        <button id="leaveTable">Leave table</button>
        <button id="closeTable" hidden>Close table</button>
      </section>
      <section id="game" hidden>
        <p id="scores"></p>
        <p id="result"></p>
        <ol id="players" start="0"></ol>
        <h3>Board</h3>
        <div id="board"></div>
        <h3>Your hand</h3>
        <p id="turn"></p>
        <div id="hand" class="tiles"></div>
        <p id="chooseSide" hidden>
          Play <span id="chosenTile"></span> on
          <button id="playLeft">the left</button> or <button id="playRight">the right</button>?
        </p>
        <h3>Moves</h3>
        <ol id="log"></ol>
      </section>
    </section>
    <p id="status"></p>
  </body>
</html>
